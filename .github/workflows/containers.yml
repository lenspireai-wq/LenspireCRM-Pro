name: Publish CRM containers
run-name: ${{ github.event_name == 'push' && github.event.head_commit.message || 'Manual deployment' }}

on:
  workflow_dispatch:
  push:
    branches: [codex/deploy-django]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/containers.yml"

permissions:
  contents: read
  packages: write

# The VPS has one Docker daemon. Queue releases instead of allowing two runs
# to compete for Docker's cleanup lock.
concurrency:
  group: lenspirecrm-vps-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lenspirecrm-api
            context: backend
          - name: lenspirecrm-web
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ghcr.io/lenspireai-wq/${{ matrix.name }}:latest

  deploy:
    name: Deploy to Hostinger VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Configure VPS SSH access
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '187.52.122.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID0TTNCpOS+vZ3OJqQAlk8+cljKktR/1vtSBqPME44kM' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host lenspire-vps
            HostName 187.52.122.113
            User root
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 5
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      - name: Recover Docker and restart CRM containers
        run: |
          for attempt in 1 2 3 4 5; do
            if ssh lenspire-vps '
              systemctl is-active --quiet docker || systemctl start docker
              cd /docker/lenspire-crm-django
              pulled=false
              for pull_attempt in 1 2 3; do
                if docker compose pull; then
                  pulled=true
                  break
                fi
                sleep $((pull_attempt * 15))
              done
              [ "$pulled" = true ] || exit 1
              docker compose up -d --remove-orphans
              docker compose exec -T api python manage.py migrate --noinput
              docker compose ps
              (docker image prune -af || echo "Docker cleanup already running; skipped for this release.")
            '; then
              exit 0
            fi
            echo "VPS deployment attempt $attempt failed; retrying shortly…"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Verify production health
        run: |
          healthy=false
          for attempt in {1..12}; do
            if ssh lenspire-vps \
              'curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/ >/dev/null && curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/api/health/ >/dev/null'; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [ "$healthy" = true ]; then
            exit 0
          fi
          ssh lenspire-vps \
            'cd /docker/lenspire-crm-django && docker compose ps && docker compose logs --tail=200 api web redis'
          exit 1
