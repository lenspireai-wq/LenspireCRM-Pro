name: Publish CRM containers

on:
  workflow_dispatch:
  push:
    branches: [codex/deploy-django]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/containers.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lenspirecrm-api
            context: backend
          - name: lenspirecrm-web
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ghcr.io/lenspireai-wq/${{ matrix.name }}:latest

  deploy:
    name: Deploy to Hostinger VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Configure VPS SSH access
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '187.52.122.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID0TTNCpOS+vZ3OJqQAlk8+cljKktR/1vtSBqPME44kM' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart CRM containers
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes root@187.52.122.113 \
            'docker builder prune -af && docker image prune -af && cd /docker/lenspire-crm-django && docker compose pull && docker compose up -d --remove-orphans && docker compose ps'

      - name: Verify production health
        run: |
          healthy=false
          for attempt in {1..12}; do
            if ssh -o BatchMode=yes -o IdentitiesOnly=yes root@187.52.122.113 \
              'curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/ >/dev/null && curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/api/health/ >/dev/null'; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [ "$healthy" = true ]; then
            exit 0
          fi
          ssh -o BatchMode=yes -o IdentitiesOnly=yes root@187.52.122.113 \
            'cd /docker/lenspire-crm-django && docker compose ps && docker compose logs --tail=200 api web redis'
          exit 1
