name: Publish CRM containers

on:
  workflow_dispatch:
  push:
    branches: [codex/deploy-django]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/containers.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lenspirecrm-api
            context: backend
          - name: lenspirecrm-web
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ghcr.io/lenspireai-wq/${{ matrix.name }}:latest
