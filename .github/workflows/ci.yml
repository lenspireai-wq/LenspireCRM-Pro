name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  electron-app:
    name: Electron App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build web renderer
        run: npm run build:web

      - name: Test suite
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev

  backend:
    name: Backend API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lenspirecrm
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lenspirecrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run migrations
        working-directory: backend
        env:
          DEBUG: "false"
          SECRET_KEY: test-secret-key-for-ci-only
          POSTGRES_DB: lenspirecrm_test
          POSTGRES_USER: lenspirecrm
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          BACKUP_ENCRYPTION_KEY: test-backup-key-32-chars-long
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: backend
        env:
          DEBUG: "false"
          SECRET_KEY: test-secret-key-for-ci-only
          POSTGRES_DB: lenspirecrm_test
          POSTGRES_USER: lenspirecrm
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          BACKUP_ENCRYPTION_KEY: test-backup-key-32-chars-long
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-${{ matrix.python-version }}

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  integration:
    name: Integration Tests (E2E)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lenspirecrm
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lenspirecrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run migrations
        working-directory: backend
        env:
          DEBUG: "false"
          SECRET_KEY: test-secret-key-for-ci-only
          POSTGRES_DB: lenspirecrm_test
          POSTGRES_USER: lenspirecrm
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          BACKUP_ENCRYPTION_KEY: test-backup-key-32-chars-long
        run: python manage.py migrate --noinput

      - name: Create test user
        working-directory: backend
        env:
          DEBUG: "false"
          SECRET_KEY: test-secret-key-for-ci-only
          POSTGRES_DB: lenspirecrm_test
          POSTGRES_USER: lenspirecrm
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          BACKUP_ENCRYPTION_KEY: test-backup-key-32-chars-long
        run: |
          python manage.py shell <<EOF
          from apps.core.models import Organization
          from apps.users.models import User
          org = Organization.objects.create(name="Test Studio", slug="test-studio")
          User.objects.create_superuser(username="admin", password="Admin1234", email="admin@test.com", organization=org)
          EOF

      - name: Start backend server
        working-directory: backend
        env:
          DEBUG: "false"
          SECRET_KEY: test-secret-key-for-ci-only
          POSTGRES_DB: lenspirecrm_test
          POSTGRES_USER: lenspirecrm
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          BACKUP_ENCRYPTION_KEY: test-backup-key-32-chars-long
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
        run: |
          python manage.py runserver 8000 &
          sleep 5
          curl --fail http://localhost:8000/api/health/ || exit 1

      - name: Start frontend server
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
        run: |
          npm run build
          npm run start &
          sleep 10
          curl --fail http://localhost:3000/ || exit 1

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_API_URL: http://127.0.0.1:8000
          BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
