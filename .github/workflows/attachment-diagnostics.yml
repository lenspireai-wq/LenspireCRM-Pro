name: Check production attachment storage
on:
  push:
    branches: [codex/deploy-django]
    paths: [".github/workflows/attachment-diagnostics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect upload storage
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '187.52.122.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID0TTNCpOS+vZ3OJqQAlk8+cljKktR/1vtSBqPME44kM' > ~/.ssh/known_hosts
          result=$(ssh -o BatchMode=yes -o IdentitiesOnly=yes root@187.52.122.113 'cd /docker/lenspire-crm-django && docker compose logs --since=2h api web 2>&1' | python -c 'import sys,re; text=sys.stdin.read(); patterns=[r"(?:PermissionError|FileNotFoundError|DataError|ProgrammingError|IntegrityError|OperationalError|RequestDataTooBig|MultiPartParserError|SuspiciousFileOperation):[^\n]*",r"[^\n]*body exceeded[^\n]*",r"[^\n]*request body[^\n]*",r"[^\n]*POST /api/attachments/[^\n]*"]; hits=[m for p in patterns for m in re.findall(p,text,re.I)]; print(" | ".join(hits[-12:]) if hits else "No matching upload errors in recent logs")')
          echo "::notice title=Upload diagnostics::$result"
