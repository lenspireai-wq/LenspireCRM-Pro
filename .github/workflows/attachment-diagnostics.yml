name: Check production attachment storage
on:
  push:
    branches: [codex/deploy-django]
    paths: [".github/workflows/attachment-diagnostics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect upload storage
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '147.79.66.80 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEI0WQF3s7wyC8/FSSkLXeWcg+Y1AgwEOx89px8obdN8' > ~/.ssh/known_hosts
          result=$(ssh -o BatchMode=yes -o IdentitiesOnly=yes root@147.79.66.80 'cd /docker/lenspire-crm-django && docker compose logs --since=2h api web 2>&1' | python -c 'import sys,re; text=sys.stdin.read(); patterns=[r"(?:PermissionError|FileNotFoundError|DataError|ProgrammingError|IntegrityError|OperationalError|RequestDataTooBig|MultiPartParserError|SuspiciousFileOperation):[^\n]*",r"[^\n]*body exceeded[^\n]*",r"[^\n]*request body[^\n]*",r"[^\n]*POST /api/(?:attachments|events/import)/[^\n]*",r"[^\n]*Internal Server Error[^\n]*",r"[^\n]*(?:WORKER TIMEOUT|Worker failed to boot|Error handling request)[^\n]*"]; hits=[m for p in patterns for m in re.findall(p,text,re.I)]; traces=[line.strip() for chunk in text.split("Traceback (most recent call last):")[1:] for line in chunk.splitlines() if re.search(r"File \\\"/app/|(?:Error|Exception):", line)]; print(" | ".join((hits+traces)[-20:]) if hits or traces else "No matching import errors in recent logs")')
          echo "::notice title=Upload diagnostics::$result"
