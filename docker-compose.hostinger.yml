services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: https://github.com/lenspireai-wq/LenspireCRM-Pro.git#codex/deploy-django:backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: &backend_environment
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: crm.lenspireai.com,187.52.122.113,api
      CORS_ALLOWED_ORIGINS: https://crm.lenspireai.com
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CLIENT_PORTAL_BASE_URL: https://crm.lenspireai.com
      SECURE_SSL_REDIRECT: "false"
      LOG_LEVEL: INFO
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py migrate_from_worker &&
             python manage.py collectstatic --noinput &&
             gunicorn lenspirecrm.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -"

  worker:
    build:
      context: https://github.com/lenspireai-wq/LenspireCRM-Pro.git#codex/deploy-django:backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *backend_environment
    command: celery -A lenspirecrm worker -l info --concurrency=1

  beat:
    build:
      context: https://github.com/lenspireai-wq/LenspireCRM-Pro.git#codex/deploy-django:backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *backend_environment
    command: celery -A lenspirecrm beat -l info

  web:
    build:
      context: https://github.com/lenspireai-wq/LenspireCRM-Pro.git#codex/deploy-django:frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:3000"
