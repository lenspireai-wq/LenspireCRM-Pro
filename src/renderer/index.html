<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://lenspirecrm-api.lenspirecrm-worker.workers.dev; connect-src 'self'">
  <title>LenspireCRM · Studio Workspace</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .slotting-event-modal { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 24px); overflow: auto; }
    .slotting-event-modal .modal-head { padding: 13px 16px; }
    .slotting-event-modal .modal-head h2 { font-size: 17px; }
    .slotting-event-grid { padding: 14px 16px; gap: 9px 11px; }
    .slotting-event-grid input,
    .slotting-event-grid select,
    .crew-picker-toggle { height: 33px; margin-top: 4px; }
    .slotting-event-grid textarea { min-height: 55px; margin-top: 4px; }
    .slotting-event-modal .modal-actions { padding: 10px 16px; }
    .crew-picker-menu { width: 100%; max-height: 190px; padding: 4px; }
    .crew-picker-menu { overflow-x: hidden; }
    .slotting-event-grid .crew-options label {
      width: 100%; min-height: 34px; display: grid;
      grid-template-columns: 14px minmax(0, 1fr); align-items: center;
      gap: 8px; padding: 5px 7px;
    }
    .slotting-event-grid .crew-options label[hidden] { display: none !important; }
    .slotting-event-grid .crew-picker-menu input[type="checkbox"] {
      appearance: auto; width: 14px !important; height: 14px !important;
      min-width: 14px; margin: 0 !important; padding: 0 !important;
    }
    .crew-options label:hover { background: rgba(115,103,240,.1); }
    .crew-options label > span { min-width: 0; overflow: hidden; }
    .crew-picker-menu b { font-size: 9px; line-height: 1.15; white-space: normal; }
    .crew-picker-menu small { font-size: 8px; line-height: 1.15; white-space: nowrap; }
    .crew-picker-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .slotting-event-grid .crew-search {
      position: sticky; top: 0; z-index: 2; width: 100%; height: 31px;
      margin: 0 0 4px; padding: 0 9px; border: 1px solid #30415a;
      border-radius: 6px; background: #0b1420; color: var(--text); font-size: 9px;
    }
    .crew-no-results { display: none; padding: 14px 8px; color: var(--muted); text-align: center; font-size: 9px; }
    .crew-no-results.visible { display: block; }
    .slotting-event-grid label:has(input[name="venue"]) { grid-column: span 2; }
    .event-form-section { grid-column: 1 / -1; min-width: 0; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: rgba(12,22,34,.46); }
    .event-section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .event-section-title span { color: #958bff; font-size: 8px; font-weight: 700; letter-spacing: 1.1px; }
    .event-section-title b { color: var(--text); font: 700 12px Manrope; }
    .event-section-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px 11px; align-items: start; }
    .event-section-grid .full { grid-column: 1 / -1; }
    .event-section-grid label:has(input[name="venue"]) { grid-column: span 2; }
    .assignment-section .event-section-grid { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .assignment-section .event-section-grid label:has(input[name="venue"]) { grid-column: span 3; }
    .event-row-break { grid-column: 1 / -1; height: 0; }
    .time-12-picker { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 4px; }
    .slotting-event-grid .time-12-picker select { margin-top: 0; padding: 0 6px; }
    .crew-assignment-cell, .slot-wrap-cell { white-space: normal; min-width: 145px; line-height: 1.35; }
    .slotted-crew { padding: 4px 0; border-bottom: 1px solid rgba(130,144,167,.14); }
    .slotted-crew:last-child { border-bottom: 0; }
    .slotted-crew b, .slotted-crew small { display: block; }
    .slotted-crew b { font-size: 9px; color: var(--text); }
    .slotted-crew small { margin-top: 2px; color: var(--muted); font-size: 8px; }
    .slotting-panel th, .slotting-panel td,
    .filtered-leads-panel th, .filtered-leads-panel td.slot-center { text-align: center; }
    .slotted-crew { border-radius: 6px; padding: 5px 7px; margin: 3px 0; text-align: center; }
    .slotted-crew.crew-assigned { background: rgba(91, 214, 143, .16); border: 1px solid rgba(91, 214, 143, .28); }
    .slotted-crew.crew-assigned b { color: #91efb8; }
    .slotted-crew.crew-assigned small { color: #75cfa0; }
    .slotted-crew.crew-unavailable { background: rgba(244, 210, 92, .18); border: 1px solid rgba(244, 210, 92, .30); }
    .slotted-crew.crew-unavailable b { color: #ffe58a; }
    .slotted-crew.crew-na { background: rgba(244, 153, 70, .18); border: 1px solid rgba(244, 153, 70, .32); }
    .slotted-crew.crew-na b { color: #ffb874; }
    td.crew-full { background: rgba(20, 120, 60, .22); border: 1px solid rgba(20, 120, 60, .45); }
    td.crew-full .slotted-crew b { color: #5eff9a; }
    td.crew-full .slotted-crew small { color: #3cc96a; }
    td.crew-unavailable-cell { background: rgba(160, 120, 10, .22); border: 1px solid rgba(160, 120, 10, .45); }
    td.crew-unavailable-cell .slotted-crew b { color: #ffd966; }
    td.crew-unavailable-cell .slotted-crew small { color: #d4b83a; }
    td.event-prewedding { background: rgba(244, 131, 184, .17); color: #ffabd2; font-weight: 700; }
    td.event-night-wedding { background: rgba(239, 100, 65, .19); color: #ff9a78; font-weight: 700; }
    .sidebar { --sidebar-width: 238px; width: var(--sidebar-width); flex-basis: var(--sidebar-width); transition: margin-left .25s ease, transform .25s ease; }
    .app-shell.sidebar-hidden .sidebar { margin-left: calc(-1 * var(--sidebar-width)); }
    .main { transition: width .25s ease; }
    #menuBtn { min-width: 34px; font-size: 20px; cursor: pointer; }
    @media (max-width: 1250px) and (min-width: 901px) { .sidebar { --sidebar-width: 205px; } }
    @media (max-width: 900px) {
      .sidebar { --sidebar-width: 238px; margin-left: calc(-1 * var(--sidebar-width)); transform: none; }
      .app-shell:not(.sidebar-hidden) .sidebar { margin-left: 0; }
      .app-shell.sidebar-hidden .sidebar { margin-left: calc(-1 * var(--sidebar-width)); }
    }
    .slotting-sheet-view table { width: max-content; min-width: 100%; }
    .content.slotting-sheet-view { display: flex; min-height: 0; flex-direction: column; overflow: hidden; }
    .slotting-sheet-view .welcome { flex: 0 0 auto; }
    .slotting-sheet-view .filtered-leads-panel { min-height: 0; flex: 1 1 auto; }
    .slotting-sheet-view .table-wrap { min-height: 0; flex: 1 1 auto; overflow: auto; }
    .slotting-sheet-view th { height: 40px; min-width: 105px; padding: 0 7px; border: 1px solid rgba(55, 70, 88, .9); vertical-align: middle; }
    .slotting-sheet-view td { height: 52px; min-width: 105px; padding: 5px 7px; border: 1px solid rgba(46, 61, 78, .82); vertical-align: middle; }
    .slotting-sheet-view tbody tr { height: 52px; }
    .slotting-sheet-view .slot-action-head,
    .slotting-sheet-view .slot-action-cell { min-width: 96px; width: 96px; }
    .slotting-sheet-view .slot-serial-head,
    .slotting-sheet-view .slot-serial-cell { min-width: 55px; width: 55px; }
    .slotting-sheet-view .crew-assignment-cell,
    .slotting-sheet-view .slot-wrap-cell { min-width: 105px; max-width: 150px; }
    .slotting-sheet-view td.slot-contact-cell { min-width: 115px; width: 115px; max-width: 115px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slotting-sheet-view td.slot-note-cell, .slotting-sheet-view td.slot-venue-cell { min-width: 150px; width: 150px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slotting-sheet-view .slotted-crew { padding: 4px 5px; margin: 2px 0; }
    .calendar .event { min-height: 25px; padding: 6px 7px; font-size: 11px; font-weight: 700; line-height: 1.2; }
    .calendar .event strong, .calendar .event small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .calendar .event strong { font-size: 11px; }
    .calendar .event small { margin-top: 2px; color: inherit; opacity: .78; font-size: 9px; font-weight: 600; }
    .nav-group.open .nav-submenu { max-height: 280px; }
    .photographer-heading { align-items: center; }
    .photographer-heading h2 { display: none; }
    .photographer-heading-actions { display: flex; align-items: center; gap: 8px; }
    .photographer-kpi { min-width: 145px; height: 54px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 8px 11px; border: 1px solid rgba(49,200,135,.25); border-radius: 9px; background: rgba(49,200,135,.09); color: #7be4b0; cursor: pointer; text-align: left; }
    .photographer-kpi span { color: inherit; font-size: 7px; letter-spacing: .5px; }
    .photographer-kpi b { font: 800 19px Manrope; }
    .photographer-kpi.outside { border-color: rgba(79,140,255,.25); background: rgba(79,140,255,.09); color: #8bb4ff; }
    .photographer-kpi.active { border-color: currentColor; box-shadow: 0 0 0 2px rgba(115,103,240,.15); }
    @media(max-width:1000px){.photographer-heading{align-items:flex-start;flex-direction:column}.photographer-heading-actions{width:100%;flex-wrap:wrap}}
    #photographerForm .form-grid { align-items: end; }
    #photographerForm .form-grid > label, #photographerForm .photographer-work-field { min-width: 0; }
    .photographer-work-field > span { color: #9facbd; font-size: 10px; font-weight: 600; }
    .photographer-work-picker .crew-picker-menu { width: 100%; }
    .photographer-work-picker .crew-options > label { width: 100%; min-height: 32px; display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 8px; padding: 5px 7px; }
    .photographer-work-picker input[type="checkbox"] { appearance: auto; width: 14px !important; height: 14px !important; min-width: 14px; margin: 0 !important; padding: 0 !important; }
    .photographer-work-picker .crew-options b { font-size: 9px; }
    .photographer-heading + .filtered-leads-panel th, .photographer-heading + .filtered-leads-panel td { text-align: center; }
    .photographer-row-actions { display: flex; justify-content: center; gap: 6px; }
    .photographer-row-actions button { height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface2); color: var(--text); font-size: 8px; cursor: pointer; }
    .photographer-row-actions button.danger { border-color: rgba(239,91,103,.3); background: rgba(239,91,103,.1); color: #ff8992; }
    .whatsapp-event-button { min-width: 62px; height: 29px; margin-right: 5px; padding: 0 9px; border: 1px solid rgba(45,211,102,.35); border-radius: 7px; background: rgba(45,211,102,.13); color: #55df87; font-size: 9px; font-weight: 700; cursor: pointer; vertical-align: middle; }
    .whatsapp-event-button:hover { background: rgba(45,211,102,.24); color: #7ff0a5; }
    .event-message-card { width: min(820px, calc(100vw - 36px)); }
    .event-message-body { padding: 14px 18px; }
    .event-message-body textarea { width: 100%; min-height: 58vh; resize: vertical; padding: 15px; border: 1px solid var(--line); border-radius: 9px; background: #0b1420; color: var(--text); font: 12px/1.55 'Segoe UI Emoji','Noto Color Emoji','Segoe UI',sans-serif; outline: none; }
    .event-message-body textarea:focus { border-color: var(--primary); }
    .tbd-date, .tbd-date + small { display: block; text-align: center; }
    .tbd-date { color: #ffc56c; font-size: 10px; }
    .tbd-date + small { margin-top: 2px; color: var(--muted); font-size: 8px; white-space: nowrap; }
    .production-edit-queue-view { display: flex; min-height: 0; flex-direction: column; overflow: hidden; }
    .production-edit-queue-view .accounts-view { min-height: 0; flex: 1 1 auto; overflow: hidden; }
    .production-edit-queue-view .filter-bar { flex: 0 0 auto; }
    .production-edit-queue-view .filtered-leads-panel { min-height: 0; flex: 1 1 auto; }
    .production-edit-queue-view .table-wrap { min-height: 0; flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; }
    .production-workflow-modal { display: flex; width: min(1050px, calc(100vw - 32px)); max-height: 92vh; flex-direction: column; overflow: hidden; }
    .production-workflow-modal .modal-head, .production-workflow-modal .modal-actions { flex: 0 0 auto; }
    .production-workflow-body { min-height: 0; padding: 16px 20px; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
    .production-job-summary { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 14px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface2); }
    .production-job-summary span { color: var(--muted); font-size: 10px; }
    .workflow-brief { display: grid; gap: 7px; margin-bottom: 14px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .workflow-brief textarea, .deliverable-fields input, .deliverable-fields select, .editor-drive-field input { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: #0b1420; color: var(--text); padding: 9px 10px; outline: none; }
    .deliverable-editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .deliverable-editor { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(12,22,34,.6); }
    .deliverable-editor.deliverable-disabled { opacity: .55; }
    .deliverable-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .deliverable-enable { display: flex; align-items: center; gap: 7px; color: var(--text); }
    .deliverable-enable input { width: 15px; height: 15px; }
    .deliverable-fields { display: grid; grid-template-columns: 90px 1fr; gap: 9px; }
    .deliverable-fields label, .editor-drive-field { display: grid; gap: 5px; color: var(--muted); font-size: 9px; font-weight: 700; }
    .deliverable-drive-link { display: inline-block; margin-top: 9px; color: #8c82ff; font-size: 10px; }
    .deliverable-review-actions, .editor-task-actions, .task-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .deliverable-review-actions { margin-top: 10px; }
    .revision-note { margin-top: 9px; padding: 8px 10px; border: 1px solid rgba(240,165,43,.3); border-radius: 7px; background: rgba(240,165,43,.09); color: #ffd38a; font-size: 10px; line-height: 1.45; }
    .production-field-value { display: flex; align-items: center; min-height: 34px; color: var(--text); font-size: 12px; }
    .priority { padding: 4px 7px; border-radius: 999px; font-size: 8px; font-weight: 800; text-transform: uppercase; }
    .priority.normal { background: rgba(79,140,255,.13); color: #8eb5ff; }
    .priority.high { background: rgba(240,165,43,.14); color: #ffc663; }
    .priority.urgent { background: rgba(239,91,103,.16); color: #ff8992; }
    .editor-task-card.task-overdue { border-color: rgba(239,91,103,.48); box-shadow: inset 3px 0 0 #ef5b67; }
    tr.ongoing-overdue td:first-child { box-shadow: inset 3px 0 0 #ef5b67; }
    .editor-task-card .production-body { gap: 12px; }
    .editor-task-card .production-body > div { min-width: 0; }
    .editor-task-card .production-body > div b { overflow-wrap: anywhere; }
    .editor-drive-field { grid-column: 1 / -1; }
    @media (max-width: 700px) {
      .slotting-event-grid { grid-template-columns: 1fr 1fr; }
      .event-section-grid { grid-template-columns: 1fr 1fr; }
      .assignment-section .event-section-grid { grid-template-columns: 1fr 1fr; }
      .assignment-section .event-section-grid label:has(input[name="venue"]) { grid-column: span 1; }
      .deliverable-editor-grid, .deliverable-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
