name = "lenspirecrm-api"
main = "./index.js"
compatibility_date = "2026-08-29"
account_id = "0700e083fb08e80ea8f648fa238e8636"
workers_dev = true

[[hyperdrive]]
binding = "CRM_DB"
id = "e7fa4cf3502649b599aa82e6d08e6836"

[[r2_buckets]]
binding = "STUDIO_ASSETS"
bucket_name = "lenspirecrm-studio-assets"

[observability]
enabled = true
head_sampling_rate = 1

# Plain-text configuration variables (not secrets).
# Set the production value via `wrangler secret put` for secrets, or override
# plain vars here or through the dashboard.
[vars]
# Base domain for client-facing portal links (e.g. "portal.lenspireai.com").
# When unset at deploy, the Worker derives a fallback from the request host.
PORTAL_DOMAIN = "portal.lenspireai.com"

# CRON trigger for automatic daily backups.
# Runs at 02:00 UTC every day. Override in the dashboard if needed.
[triggers]
crons = ["0 2 * * *"]

# crm.lenspireai.com is hosted on Hostinger and proxies this Worker's
# workers.dev endpoint. Keep workers_dev enabled unless the domain's DNS zone
# is moved into this Cloudflare account.

# Production bindings and secrets stay in Cloudflare. Before the first
# command-line deployment, add the existing CRM_DB binding and all current
# Worker secrets through Cloudflare/Wrangler; never store secret values here.
#
# BACKUP_ENCRYPTION_KEY — 32-char secret used to encrypt auto-backup blobs at
# rest in the database. Set with: npx wrangler secret put BACKUP_ENCRYPTION_KEY
